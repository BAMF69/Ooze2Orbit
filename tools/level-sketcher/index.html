<!doctype html>
<!-- ---------------------------------------------------------------------------
  tools/level-sketcher/index.html
  Purpose : Hand-design creature Water levels: arrange rooms on a minimap, paint each room on the real
            16 px lattice (40x15 tiles per 640x360 screen), reuse layouts from a room library, and check
            reachability with an approximation of creature/physics.ts. The lessons feed the generator
            (docs/CREATURE_LEVELGEN.md, levelgen/templates.ts).
  Usage   : open this file in a browser, or `npm run dev` and visit /tools/level-sketcher/index.html.
            Export JSON to save a level and its library; Import to load one.
  Notes   : Standalone, no build step, no dependencies. Movement constants copied from CR.move and WATER;
            keep PHYS in sync if those change. Not yet read by the game.
  Authored: Written with Claude (Opus 5.5, claude-opus-5-5)
---------------------------------------------------------------------------- -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Sketcher</title>
<style>
:root{--bg:#0b1116;--panel:#121b22;--panel2:#18242d;--line:#24343f;--text:#d8e4ea;--dim:#7d93a0;--accent:#4fd1a5;--warn:#f0b429;--bad:#ef5350;--good:#66bb6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:14px;margin:0 8px 0 0;color:var(--accent);letter-spacing:.5px}
header input,header select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tabs button{border-radius:4px 4px 0 0}
.tabs button.on{background:var(--accent);color:#04140e;font-weight:600}
.spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
button.on{background:#1f4a3d;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:190px 1fr 320px;height:calc(100% - 41px)}
aside{background:var(--panel);overflow:auto;padding:10px}
#tools{border-right:1px solid var(--line)}
#side{border-left:1px solid var(--line)}
#stage{position:relative;overflow:auto;padding:12px}
#cv{display:block;image-rendering:pixelated;cursor:crosshair}
#status{position:sticky;left:0;bottom:-12px;margin-top:8px;color:var(--dim);font-size:12px;background:var(--bg);padding:4px 0}
h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:14px 0 6px}

.toolbtn{width:100%;text-align:left;margin-bottom:3px;display:flex;justify-content:space-between}

<body>
<header>
  <h1>OOZE2ORBIT · LEVEL SKETCHER</h1>
  <input id="levelName" type="text" size="18" title="Level name">
  <select id="levelTier" title="Level difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
  <div class="tabs">
    <button data-mode="map">1 · Minimap</button>
    <button data-mode="room">2 · Paint room</button>
    <button data-mode="library">3 · Room library</button>
  </div>
  <span class="spacer"></span>
  <button id="btnNew" title="Start an empty level (the library is kept)">New level</button>
  <button id="btnImport">Import…</button>
  <button id="btnExport">Export JSON</button>

</header>
<main>
  <aside id="tools"></aside>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="lib"></div>
    <div id="status"></div>
  </section>
  <aside id="side"></aside>
</main>
<script>
"use strict";
// ============================================================================================
// Constants: one screen = 40 x 15 tiles of 16 px. Row 0 = engine ty 5 (ceiling), row 14 = ty 19 (floor),
// so a painted 1x1 room maps 1:1 onto the game's 640 x 360 room lattice (tx = col, ty = row + 5).
// Movement numbers are copied from creature/tuning.ts (CR.move) and waterWorld.ts (WATER).
// ============================================================================================
const TW = 40, TH = 15, T = 16;
const PHYS = { g: 900, jump: 400, breach: 360, run: 105, sprint: 165, swim: 85, fin: 155, dt: 1 / 60, maxFall: 520, steps: 220 };
const TILES = {
  '.': { name: 'Air', col: '#0e1820' },
  '#': { name: 'Rock', col: '#55473a' },
  '~': { name: 'Water', col: '#1c5f86' },
  'c': { name: 'Current (torrent)', col: '#17809a' },
  '=': { name: 'Ledge (one-way)', col: '#c4914f' },
  '^': { name: 'Hazard', col: '#e0533d' },
  'B': { name: 'Breakable wall (stat/class)', col: '#7a5590' },
  'G': { name: 'Sluice gate (Gardener)', col: '#d4a72c' },
  'D': { name: 'Door opening', col: '#2fae74' },
};
const TILE_ORDER = ['.', '#', '~', 'c', '=', '^', 'B', 'G', 'D'];
const OBJ = {
  spawn: { g: 'S', col: '#ffffff', name: 'Spawn / arrival', inter: true },
  control: { g: 'L', col: '#f1c40f', name: 'Control / lever', inter: true },
  keyed: { g: 'K', col: '#ff9f43', name: 'Keyed control', inter: true },
  reward: { g: '★', col: '#ffd700', name: 'Reward / seal', inter: true },
  food: { g: '•', col: '#7ed957', name: 'Food', inter: true },
  cache: { g: '◆', col: '#80deea', name: 'Food cache', inter: true },
  netRig: { g: 'n', col: '#9fe6d0', name: 'Net rigging', inter: true },
  netFrame: { g: 'N', col: '#9fe6d0', name: 'Net frame', inter: true },
  reeds: { g: 'ψ', col: '#4caf50', name: 'Reeds / cover', inter: false },
  vent: { g: '≋', col: '#b0bec5', name: 'Pressure vent', inter: false },
  charger: { g: 'C', col: '#ef5350', name: 'Charger', inter: false },
  swimmer: { g: 'w', col: '#ff8a65', name: 'Swimmer', inter: false },
  ambusher: { g: 'A', col: '#c62828', name: 'Ambusher', inter: false },
  dropper: { g: '▼', col: '#ff4081', name: 'Ceiling dropper', inter: false },
};
const ROLES = {
  entry: '#4fc3f7', traversal: '#90a4ae', lever: '#fbc02d', drain: '#29b6f6', shaft: '#7986cb', pressure: '#ba68c8',
  arena: '#e53935', trap: '#ff7043', ceiling: '#ec407a', recovery: '#66bb6a', hub: '#a1887f', nursery: '#26a69a',
  vault: '#ffd54f', classTrial: '#ff8f00', goal: '#fff176',
};
const DIR = { N: [0, -1], S: [0, 1], W: [-1, 0], E: [1, 0] };
const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };
const GW = 22, GH = 15, CW = 80, CH = 30; // minimap grid size and cell pixels

// ============================================================================================
// Tile helpers
// ============================================================================================
function blankTiles(w, h) {
  const W = w * TW, H = h * TH, rows = [];
  for (let r = 0; r < H; r++) {
    let s = '';
    for (let c = 0; c < W; c++) s += (r === 0 || r === H - 1 || c === 0 || c === W - 1) ? '#' : '.';
    rows.push(s);
  }
  return rows;
}
const setT = (tiles, c, r, ch) => { if (r < 0 || r >= tiles.length || c < 0 || c >= tiles[0].length) return; const s = tiles[r]; if (s[c] !== ch) tiles[r] = s.slice(0, c) + ch + s.slice(c + 1); };
const getT = (tiles, c, r) => (r < 0 || r >= tiles.length || c < 0 || c >= tiles[0].length) ? '#' : tiles[r][c];
function fillRect(tiles, c0, r0, c1, r1, ch) { for (let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++) for (let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++) setT(tiles, c, r, ch); }

// Door openings: where the Door tool carves an exit in a room's painted edge.
function doorSpan(room, d) {
  const W = room.w * TW, H = room.h * TH;
  if (d.side === 'W' || d.side === 'E') { const c = d.side === 'W' ? 0 : W - 1, r1 = d.cy * TH + TH - 2; return { cells: [10, 11, 12, 13].map(k => [c, d.cy * TH + k]), inner: d.side === 'W' ? 1 : -1, r1 }; }
  const r = d.side === 'N' ? 0 : H - 1; return { cells: [18, 19, 20, 21].map(k => [d.cx * TW + k, r]) };
}
function carveDoor(room, d) {
  for (const [c, r] of doorSpan(room, d).cells) {
    setT(room.tiles, c, r, 'D');
    // Clear one tile inward so the opening is not plugged by the border.
    const ic = d.side === 'W' ? c + 1 : d.side === 'E' ? c - 1 : c, ir = d.side === 'N' ? r + 1 : d.side === 'S' ? r - 1 : r;
    if (getT(room.tiles, ic, ir) === '#') setT(room.tiles, ic, ir, '.');
  }
}
function uncarveDoor(room, d) {
  const W = room.w * TW, H = room.h * TH;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (getT(room.tiles, c, r) !== 'D') continue;
    const onEdge = d.side === 'W' ? c === 0 && Math.floor(r / TH) === d.cy : d.side === 'E' ? c === W - 1 && Math.floor(r / TH) === d.cy
      : d.side === 'N' ? r === 0 && Math.floor(c / TW) === d.cx : r === H - 1 && Math.floor(c / TW) === d.cx;
    if (onEdge) setT(room.tiles, c, r, '#');
  }
}

// ============================================================================================
// Starter library: the five v1 Water templates, transcribed from levelgen/templates.ts, plus two new shapes.
// ============================================================================================
function starterLibrary() {
  const L = [];
  const mk = (name, tags, w, h, build) => { const tiles = blankTiles(w, h), objects = []; build(tiles, objects); L.push({ id: 'lib' + (L.length + 1), name, tags, w, h, tiles, objects, starter: true }); };
  const sideDoors = (t, w = 1) => { for (const r of [10, 11, 12, 13]) { setT(t, 0, r, 'D'); setT(t, w * TW - 1, r, 'D'); } };
  const pool = (t, r0 = 13) => fillRect(t, 9, r0, 33, 13, '~');
  const o = (objects, type, x, y, extra) => objects.push({ type, x, y, ...extra });
  mk('v1 Lever / sluice', 'lever', 1, 1, (t, ob) => {
    sideDoors(t); pool(t); fillRect(t, 10, 9, 12, 9, '#'); fillRect(t, 18, 1, 18, 13, 'G');
    o(ob, 'spawn', 3, 13); o(ob, 'control', 11, 8, { label: 'Upper sluice lever' }); [7, 13, 24, 32].forEach(x => o(ob, 'food', x, 13));
    o(ob, 'reeds', 15, 13); o(ob, 'charger', 26, 13); o(ob, 'netRig', 6, 13); o(ob, 'netFrame', 23, 12);
  });
  mk('v1 Drain chamber', 'drain', 1, 1, (t, ob) => {
    sideDoors(t); pool(t); fillRect(t, 11, 10, 13, 10, '#'); fillRect(t, 19, 14, 21, 14, 'D');
    o(ob, 'spawn', 3, 13); o(ob, 'control', 30, 13, { label: '1 · Drain control', guarded: true }); o(ob, 'control', 12, 9, { label: '2 · Upper release' });
    o(ob, 'charger', 27, 13); o(ob, 'reeds', 16, 13);
  });
  mk('v1 Shaft relay', 'shaft', 1, 1, (t, ob) => {
    sideDoors(t); pool(t); fillRect(t, 10, 1, 14, 10, '#'); fillRect(t, 26, 1, 29, 10, '#'); fillRect(t, 19, 11, 21, 13, '#'); fillRect(t, 7, 10, 9, 10, '#');
    fillRect(t, 16, 0, 18, 0, 'D');
    o(ob, 'spawn', 3, 13); o(ob, 'control', 17, 9, { label: '1 · Shaft relay' }); o(ob, 'control', 31, 13, { label: '2 · Lower latch' }); o(ob, 'cache', 17, 10);
  });
  mk('v1 Pressure crossing', 'pressure', 1, 1, (t, ob) => {
    sideDoors(t); pool(t); fillRect(t, 11, 10, 13, 10, '#'); fillRect(t, 7, 0, 8, 0, 'D');
    o(ob, 'spawn', 3, 13); o(ob, 'control', 30, 13, { label: '1 · Charge pressure', guarded: true }); o(ob, 'control', 12, 9, { label: '2 · Timed release' }); o(ob, 'vent', 24, 13);
    o(ob, 'swimmer', 27, 13);
  });
  mk('v1 Grotto / nursery', 'vault nursery', 1, 1, (t, ob) => {
    for (const r of [10, 11, 12, 13]) setT(t, 0, r, 'D'); pool(t); fillRect(t, 16, 9, 19, 9, '#'); fillRect(t, 7, 14, 8, 14, 'D');
    o(ob, 'control', 18, 8, { label: 'Upper sluice lever' }); o(ob, 'reward', 36, 13, { label: 'Sample' }); o(ob, 'reeds', 14, 13);
  });
  mk('New · Climbing well (1×2)', 'shaft traversal', 1, 2, (t, ob) => {
    fillRect(t, 18, 0, 21, 0, 'D'); fillRect(t, 18, 29, 21, 29, 'D'); for (const r of [24, 25, 26, 27]) setT(t, 0, r, 'D');
    fillRect(t, 1, 28, 38, 28, '#'); fillRect(t, 18, 28, 21, 28, '.');
    [[6, 24], [14, 20], [24, 17], [32, 13], [22, 9], [12, 5]].forEach(([c, r]) => fillRect(t, c, r, c + 4, r, '='));
    fillRect(t, 26, 23, 37, 27, '~'); o(ob, 'food', 34, 12); o(ob, 'dropper', 20, 2);
  });
  mk('New · Flooded undercroft (2×1)', 'traversal recovery', 2, 1, (t, ob) => {
    for (const r of [10, 11, 12, 13]) { setT(t, 0, r, 'D'); setT(t, 79, r, 'D'); }
    fillRect(t, 12, 1, 67, 6, '#'); fillRect(t, 12, 9, 67, 13, '~'); fillRect(t, 30, 7, 31, 13, '#'); fillRect(t, 48, 7, 49, 13, '#');
    fillRect(t, 30, 12, 31, 13, '~'); fillRect(t, 48, 12, 49, 13, '~'); fillRect(t, 38, 7, 41, 7, '#');
    o(ob, 'cache', 40, 6); o(ob, 'swimmer', 22, 11); o(ob, 'swimmer', 58, 11); o(ob, 'reeds', 8, 13);
  });
  return L;
}

// ============================================================================================
// Reachability: a tile-lattice approximation of creature/physics.ts. Full jumps only (the game has no jump cut),
// steady horizontal speed, swim anywhere in water, breach-jump from the surface. A stand-in for the real
// controller bots, good for "can I get there at all", not for frame-perfect feel.
// ============================================================================================
function Grid(tiles, gatesOpen) {
  const H = tiles.length, W = tiles[0].length;
  const at = (c, r) => (c < 0 || r < 0 || c >= W || r >= H) ? '#' : tiles[r][c];
  const solid = (c, r) => { const t = at(c, r); return t === '#' || (!gatesOpen && (t === 'B' || t === 'G')); };
  const water = (c, r) => { const t = at(c, r); return t === '~' || t === 'c'; };
  const haz = (c, r) => at(c, r) === '^';
  return { W, H, at, solid, water, haz };
}
const boxCells = (x, y) => [Math.floor((x - 7) / T), Math.floor((x + 6.999) / T), Math.floor((y - 17.999) / T), Math.floor((y - 0.001) / T)];
function boxAny(x, y, f) { const [c0, c1, r0, r1] = boxCells(x, y); for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (f(c, r)) return true; return false; }
function standable(g, c, r) {
  return !g.solid(c, r) && !g.solid(c, r - 1) && !g.haz(c, r) && !g.haz(c, r - 1) && !g.water(c, r) && (g.solid(c, r + 1) || g.at(c, r + 1) === '=');
}
const JUMPS = [[0, 0]], BREACH = [[0, 0]];
for (const s of [-1, 1]) {
  for (const v of [55, 105, 165]) JUMPS.push([s * v, s * v], [s * v, 0]);
  JUMPS.push([0, s * 105], [0, s * 165]);
  for (const v of [85, 155]) BREACH.push([s * v, s * v], [s * v, 0], [0, s * v]);
}
function simulate(g, x, y, vxA, vxB, vy) {
  const cells = [];
  if (boxAny(x, y, g.solid)) return { ok: false };
  for (let i = 0; i < PHYS.steps; i++) {
    vy = Math.min(PHYS.maxFall, vy + PHYS.g * PHYS.dt);
    const vx = vy < 0 ? vxA : vxB;
    const nx = x + vx * PHYS.dt;
    if (!boxAny(nx, y, g.solid)) x = nx;
    const ny = y + vy * PHYS.dt;
    if (vy < 0) { if (boxAny(x, ny, g.solid)) vy = 0; else y = ny; }
    else {
      const row = Math.floor((ny - 0.001) / T), [c0, c1] = boxCells(x, ny);
      let landY = null;
      if (boxAny(x, ny, g.solid)) landY = row * T;
      else if (y <= row * T + 0.001) { for (let c = c0; c <= c1; c++) if (g.at(c, row) === '=') landY = row * T; }
      if (landY !== null) {
        y = landY; pushBox(cells, g, x, y);
        if (boxAny(x, y, g.haz)) return { ok: false };
        const fr = Math.round(y / T) - 1, cc = Math.floor(x / T);
        for (const c of [cc, c0, c1]) if (standable(g, c, fr)) return { ok: true, cells, node: { t: 's', c, r: fr } };
        return { ok: true, cells, node: null };
      }
      y = ny;
    }
    if (boxAny(x, y, g.haz)) return { ok: false };
    pushBox(cells, g, x, y);
    const wc = Math.floor(x / T), wr = Math.floor((y - 2) / T);
    if (g.water(wc, wr)) return { ok: true, cells, node: { t: 'w', c: wc, r: wr } };
    if (y > g.H * T + 40) break;
  }
  return { ok: true, cells, node: null };
}
function pushBox(cells, g, x, y) { const [c0, c1, r0, r1] = boxCells(x, y); for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (c >= 0 && r >= 0 && c < g.W && r < g.H) cells.push(r * g.W + c); }
function reach(g, seeds) {
  const vis = new Uint8Array(g.W * g.H), nodes = new Set(), q = [], stand = [];
  const mark = (c, r) => { if (c >= 0 && r >= 0 && c < g.W && r < g.H) vis[r * g.W + c] = 1; };
  const push = n => { if (!n) return; const k = n.t + n.c + ',' + n.r; if (nodes.has(k)) return; nodes.add(k); q.push(n); if (n.t === 's') stand.push(n); };
  const run = (x, y, a, b, vy) => { const res = simulate(g, x, y, a, b, vy); if (res.ok) { for (const i of res.cells) vis[i] = 1; push(res.node); } };
  for (const s of seeds) { if (s.node) push(s.node); else if (s.traj) run(...s.traj); if (s.mark) mark(...s.mark); }
  while (q.length) {
    const n = q.pop(), x = (n.c + 0.5) * T, y = (n.r + 1) * T;
    if (n.t === 's') {
      mark(n.c, n.r); mark(n.c, n.r - 1);
      for (const d of [-1, 1]) {
        const c = n.c + d;
        if (standable(g, c, n.r)) push({ t: 's', c, r: n.r });
        else if (!g.solid(c, n.r) && !g.solid(c, n.r - 1)) {
          if (g.water(c, n.r)) push({ t: 'w', c, r: n.r });
          else { run(x + d * T, y, d * PHYS.run, d * PHYS.run, 0); run(x + d * T, y, d * PHYS.run, 0, 0); }
        }
      }
      for (const [a, b] of JUMPS) run(x, y, a, b, -PHYS.jump);
    } else {
      mark(n.c, n.r);
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const c = n.c + dc, r = n.r + dr;
        if (g.water(c, r)) { push({ t: 'w', c, r }); continue; }
        if (g.solid(c, r) || g.haz(c, r)) continue;
        if (dr === 0) { if (standable(g, c, r)) push({ t: 's', c, r }); else run((c + 0.5) * T, (r + 1) * T, dc * PHYS.swim, dc * PHYS.swim, 0); }
        else if (dr === -1) { mark(c, r); for (const [a, b] of BREACH) run(x, n.r * T + T, a, b, -PHYS.breach); }
      }
    }
  }
  return { vis, nodes, stand };

function mapCell(e) { const b = cv.getBoundingClientRect(), px = (e.clientX - b.left) * cv.width / b.width, py = (e.clientY - b.top) * cv.height / b.height; const x = Math.floor(px / CW), y = Math.floor(py / CH); return { x, y, fx: px / CW - x, fy: py / CH - y }; }
function edgeAt(m) { const d = { W: m.fx, E: 1 - m.fx, N: m.fy, S: 1 - m.fy }; const side = Object.keys(d).reduce((a, b) => d[a] <= d[b] ? a : b); return { x: m.x, y: m.y, side }; }
function areaFree(x0, y0, w, h, self) { if (x0 < 0 || y0 < 0 || x0 + w > GW || y0 + h > GH) return false; for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { const o = ownerAt(x, y); if (o && o.id !== self) return false; } return true; }
function roomCell(e) { const t = getTarget(); if (!t) return null; const z = roomZoom(t.obj), b = cv.getBoundingClientRect(); const c = Math.floor((e.clientX - b.left) * cv.width / b.width / z), r = Math.floor((e.clientY - b.top) * cv.height / b.height / z); return { c, r, inside: c >= 0 && r >= 0 && c < t.obj.w * TW && r < t.obj.h * TH }; }

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => { if (UI.mode === 'map') mapDown(e); else if (UI.mode === 'room') roomDown(e); });
window.addEventListener('mousemove', e => { if (UI.mode === 'map') mapMove(e); else if (UI.mode === 'room') roomMove(e); });
window.addEventListener('mouseup', e => { if (UI.mode === 'map') mapUp(e); else if (UI.mode === 'room') roomUp(e); });
cv.addEventListener('dblclick', e => { if (UI.mode !== 'map') return; const m = mapCell(e), r = ownerAt(m.x, m.y); if (r) openRoom(r.id); });
cv.addEventListener('mouseleave', () => { UI.hover = null; draw(); });

function mapDown(e) {
  const m = mapCell(e), r = ownerAt(m.x, m.y);
  if (UI.mapTool === 'room') { if (r) { UI.selRoom = r.id; renderMapSide(); draw(); return; } UI.drag = { kind: 'new', x0: m.x, y0: m.y, x1: m.x, y1: m.y, ok: true }; draw(); }
  else if (UI.mapTool === 'select') { UI.selRoom = r ? r.id : null; if (r) UI.drag = { kind: 'move', room: r.id, ox: m.x - r.x, oy: m.y - r.y, nx: r.x, ny: r.y, ok: true }; renderMapSide(); draw(); }
  else if (UI.mapTool === 'erase') { if (r && confirm(`Delete room "${r.name}"? Its painted layout is lost unless saved to the library.`)) { removeRoom(r); changed(); } }
  else if (UI.mapTool === 'door') { toggleDoor(edgeAt(m)); }
}
function mapMove(e) {
  if (!UI.drag && UI.mapTool !== 'door') return;
  const m = mapCell(e);
  if (UI.drag?.kind === 'new') { const d = UI.drag; d.x1 = Math.max(0, Math.min(GW - 1, m.x)); d.y1 = Math.max(0, Math.min(GH - 1, m.y)); d.ok = areaFree(Math.min(d.x0, d.x1), Math.min(d.y0, d.y1), Math.abs(d.x1 - d.x0) + 1, Math.abs(d.y1 - d.y0) + 1, null); draw(); }
  else if (UI.drag?.kind === 'move') { const d = UI.drag, r = roomById(d.room); d.nx = m.x - d.ox; d.ny = m.y - d.oy; d.ok = areaFree(d.nx, d.ny, r.w, r.h, r.id); draw(); }
  else if (UI.mapTool === 'door' && e.target === cv) { UI.hover = edgeAt(m); draw(); }
}
function mapUp() {
  const d = UI.drag; if (!d) return; UI.drag = null;
  if (d.kind === 'new' && d.ok) {
    const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1), w = Math.abs(d.x1 - d.x0) + 1, h = Math.abs(d.y1 - d.y0) + 1;
    const id = 'r' + (S.nextId++), first = !S.rooms.length;
    S.rooms.push({ id, name: first ? 'Entry' : 'Room ' + (S.nextId - 1), role: first ? 'entry' : 'traversal', tier: S.level.tier, x, y, w, h, doors: [], tiles: blankTiles(w, h), objects: first ? [{ type: 'spawn', x: 3, y: 13 }] : [], notes: '' });
    UI.selRoom = id; changed(); return;
  }
  if (d.kind === 'move' && d.ok) { const r = roomById(d.room); r.x = d.nx; r.y = d.ny; changed(); return; }
  draw();
}
function removeRoom(r) {
  // Remove the matching half of every connection so neighbours are not left with a door into nothing.
  for (const d of r.doors) { const p = partnerOf(r, d); if (p) { p.room.doors = p.room.doors.filter(x => x !== p.door); uncarveDoor(p.room, p.door); } }
  S.rooms = S.rooms.filter(x => x !== r); if (UI.selRoom === r.id) UI.selRoom = null; if (UI.target === r.id) UI.target = null;
}
function toggleDoor(edge) {
  const A = ownerAt(edge.x, edge.y); if (!A) return;
  const [dx, dy] = DIR[edge.side], B = ownerAt(edge.x + dx, edge.y + dy);
  if (B === A) { flash('That edge is inside one room. Doors go between rooms (or on an outer edge).'); return; }
  const da = { cx: edge.x - A.x, cy: edge.y - A.y, side: edge.side };
  const has = A.doors.find(d => d.cx === da.cx && d.cy === da.cy && d.side === da.side);
  const db = B ? { cx: edge.x + dx - B.x, cy: edge.y + dy - B.y, side: OPP[edge.side] } : null;
  if (has) {
    A.doors = A.doors.filter(d => d !== has); uncarveDoor(A, da);
    if (B) { const hb = B.doors.find(d => d.cx === db.cx && d.cy === db.cy && d.side === db.side); if (hb) { B.doors = B.doors.filter(d => d !== hb); uncarveDoor(B, db); } }
  } else {
    A.doors.push(da); carveDoor(A, da);
    if (B && !B.doors.some(d => d.cx === db.cx && d.cy === db.cy && d.side === db.side)) { B.doors.push(db); carveDoor(B, db); }
  }
  UI.selRoom = A.id; changed();
}

function bresenham(c0, r0, c1, r1, f) { const dc = Math.abs(c1 - c0), dr = -Math.abs(r1 - r0), sc = c0 < c1 ? 1 : -1, sr = r0 < r1 ? 1 : -1; let err = dc + dr; for (; ;) { f(c0, r0); if (c0 === c1 && r0 === r1) break; const e2 = 2 * err; if (e2 >= dr) { err += dr; c0 += sc; } if (e2 <= dc) { err += dc; r0 += sr; } } }
function objAt(o, c, r) { for (let i = o.objects.length - 1; i >= 0; i--) if (o.objects[i].x === c && o.objects[i].y === r) return i; return -1; }
function flood(tiles, c, r, ch) { const from = getT(tiles, c, r); if (from === ch) return; const W = tiles[0].length, H = tiles.length, st = [[c, r]]; while (st.length) { const [a, b] = st.pop(); if (a < 0 || b < 0 || a >= W || b >= H || tiles[b][a] !== from) continue; setT(tiles, a, b, ch); st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]); } }
function roomDown(e) {
  const t = getTarget(), p = roomCell(e); if (!t || !p?.inside) return; const o = t.obj, right = e.button === 2, ch = right ? '.' : UI.brush;
  if (UI.paintTool === 'pencil') { pushUndo(); setT(o.tiles, p.c, p.r, ch); UI.drag = { kind: 'pencil', c: p.c, r: p.r, ch }; draw(); }
  else if (UI.paintTool === 'rect') { pushUndo(); UI.drag = { kind: 'rect', c0: p.c, r0: p.r, c1: p.c, r1: p.r, ch }; draw(); }
  else if (UI.paintTool === 'fill') { pushUndo(); flood(o.tiles, p.c, p.r, ch); afterEdit(); }
  else if (UI.paintTool === 'object' || UI.paintTool === 'select') {
    const i = objAt(o, p.c, p.r);
    if (right) { if (i >= 0) { pushUndo(); o.objects.splice(i, 1); UI.selObj = -1; afterEdit(); } return; }
    if (i >= 0) { pushUndo(); UI.selObj = i; UI.drag = { kind: 'obj', i }; }
    else if (UI.paintTool === 'object') { pushUndo(); o.objects.push({ type: UI.objType, x: p.c, y: p.r }); UI.selObj = o.objects.length - 1; afterEdit(); }
    else UI.selObj = -1;
    renderObjBox(); draw();
  } else if (UI.paintTool === 'probe') { UI.probe = right ? null : { c: p.c, r: p.r }; draw(); }
}
function roomMove(e) {
  const t = getTarget(); if (!t) return; const p = roomCell(e); if (!p) return;
  if (e.target === cv && p.inside) { UI.hover = { c: p.c, r: p.r }; const ch = getT(t.obj.tiles, p.c, p.r), sx = Math.floor(p.c / TW), sy = Math.floor(p.r / TH); $('status').textContent = `tile ${p.c},${p.r} · ${TILES[ch]?.name || ch}${t.obj.w * t.obj.h > 1 ? ` · screen ${sx + 1},${sy + 1}` : ''} · engine tx ${p.c % TW}, ty ${(p.r % TH) + 5}`; }
  const d = UI.drag; if (!d) { if (e.target === cv) draw(); return; }
  const c = Math.max(0, Math.min(t.obj.w * TW - 1, p.c)), r = Math.max(0, Math.min(t.obj.h * TH - 1, p.r));
  if (d.kind === 'pencil') { bresenham(d.c, d.r, c, r, (a, b) => setT(t.obj.tiles, a, b, d.ch)); d.c = c; d.r = r; }
  else if (d.kind === 'rect') { d.c1 = c; d.r1 = r; }
  else if (d.kind === 'obj') { const ob = t.obj.objects[d.i]; ob.x = c; ob.y = r; }
  draw();
}
function roomUp() {
  const t = getTarget(), d = UI.drag; if (!d || !t) return; UI.drag = null;
  if (d.kind === 'rect') fillRect(t.obj.tiles, d.c0, d.r0, d.c1, d.r1, d.ch);
  afterEdit();
}

// Keyboard
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); doRedo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (UI.mode === 'map') {
    const m = { v: 'select', r: 'room', d: 'door', x: 'erase' }[k]; if (m) { UI.mapTool = m; renderMapTools(); draw(); }
    if ((k === 'enter' || k === 'p') && UI.selRoom) openRoom(UI.selRoom);
    if (k === 'delete' && UI.selRoom) { const r = roomById(UI.selRoom); if (r && confirm(`Delete room "${r.name}"?`)) { removeRoom(r); changed(); } }
  } else if (UI.mode === 'room') {
    const m = { p: 'pencil', r: 'rect', f: 'fill', o: 'object', v: 'select', j: 'probe' }[k];
    if (m) { UI.paintTool = m; if (m !== 'probe') UI.probe = null; renderRoomTools(); draw(); }
    if (/^[1-9]$/.test(k)) { UI.brush = TILE_ORDER[+k - 1]; if (!['pencil', 'rect', 'fill'].includes(UI.paintTool)) UI.paintTool = 'pencil'; renderRoomTools(); }
    if ((k === 'delete' || k === 'backspace') && UI.selObj >= 0) { const t = getTarget(); pushUndo(); t.obj.objects.splice(UI.selObj, 1); UI.selObj = -1; afterEdit(); }
    if (k === 'm') { UI.mode = getTarget()?.kind === 'layout' ? 'library' : 'map'; UI.probe = null; renderAll(); }
    if (k === 'escape') { UI.probe = null; UI.selObj = -1; renderObjBox(); draw(); }
  }
});

// Header
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  UI.mode = b.dataset.mode; UI.probe = null;
  if (UI.mode === 'room' && !getTarget() && UI.selRoom) UI.target = UI.selRoom;
  renderAll();
});
$('levelName').oninput = e => { S.level.name = e.target.value; saveSoon(); };
$('levelTier').onchange = e => { S.level.tier = e.target.value; saveSoon(); };
$('btnNew').onclick = () => { if (!confirm('Start a new empty level? The current minimap and rooms are cleared (export first to keep them). The room library is kept.')) return; S = newProject(S.library); Object.assign(UI, { selRoom: null, target: null, selObj: -1 }); changed(); };
$('btnExport').onclick = () => {
  const out = { ...S, exported: new Date().toISOString(), legend: { tiles: Object.fromEntries(Object.entries(TILES).map(([k, v]) => [k, v.name])), screen: `${TW}x${TH} tiles of ${T}px per minimap cell; tile (col,row) in a screen maps to engine tx=col, ty=row+5` } };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (S.level.name || 'level').replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-').toLowerCase() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('btnImport').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result); if (d.format !== 'ooze2orbit-level-sketch') throw new Error('Not a level sketch file.');
      const replace = confirm('OK = replace the current level with the imported one.\nCancel = only add its library layouts to yours.');
      if (replace) { delete d.legend; delete d.exported; S = d; Object.assign(UI, { selRoom: null, target: null, selObj: -1 }); }
      else { for (const l of d.library || []) if (!S.library.some(x => JSON.stringify(x.tiles) === JSON.stringify(l.tiles))) S.library.push({ ...l, id: 'lib' + (S.nextLib++) }); }
      changed();
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
};
window.addEventListener('resize', () => draw());
renderAll();
</script>
</body>
</html>
